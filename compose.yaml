name: mako-intelligence
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - mako_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    # PostgreSQL stays inside the Docker network, no public host port.
  backend:
    build: ./backend
    env_file: .env
    environment:
      MAKO_LOCAL_AUTH_ENABLED: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    command: python -m uvicorn mako_intelligence.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - mako_node_modules:/app/node_modules
      - mako_next_cache:/app/.next
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0
volumes:
  mako_pgdata:
  mako_node_modules:
  mako_next_cache:
