name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No deployment, production secrets, or untrusted privileged workflow execution.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql+psycopg://mako_test:local-ci-only@127.0.0.1:5432/mako_test
      MAKO_TEST_DATABASE_URL: postgresql+psycopg://mako_test:local-ci-only@127.0.0.1:5432/mako_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mako_test
          POSTGRES_USER: mako_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mako_test -d mako_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]"
      - name: Lint
        run: python -m ruff check backend/src backend/tests
      - name: Apply Alembic migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Detect ORM / migration drift
        run: alembic -c backend/alembic.ini check
      - name: Unit and PostgreSQL integration tests
        run: python -m pytest backend/tests -q
  web:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
